name: ChatGPT Encrypted Relay Test
on:
  push:
    branches: [chatgpt-temp-transfer]
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar blob criptografado
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --max-time 60 'https://litter.catbox.moe/u6cfx9.enc' -o sample.bin.enc
          test "$(sha256sum sample.bin.enc | cut -d' ' -f1)" = '4a882f2135f0792f4c40ee49fdaf2b88fb2ab4b6a31f3c46febc2a1f96bb2d70'
      - name: Disponibilizar artefato criptografado
        uses: actions/upload-artifact@v4
        with:
          name: sample-encrypted-relay
          path: sample.bin.enc
          retention-days: 1
          if-no-files-found: error
